# ─────────────────────────────────────────────────────────────
# Market Data Pipeline — Configuration
# ─────────────────────────────────────────────────────────────
# Edit this file to change tickers, FRED series, or settings.
# No code changes required.
# ─────────────────────────────────────────────────────────────

database:
  path: data/market.db

# ── Equity tickers to track ───────────────────────────────────
tickers:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMZN
  - GOOGL
  - META
  - JPM

# ── Federal Reserve FRED series ───────────────────────────────
# Series IDs from https://fred.stlouisfed.org/
fred_series:
  - DGS10      # 10-Year Treasury Yield        (daily)
  - DGS2       # 2-Year Treasury Yield         (daily)
  - T10Y2Y     # 10Y–2Y Yield Spread           (daily)
  - CPIAUCSL   # Consumer Price Index          (monthly)
  - FEDFUNDS   # Effective Fed Funds Rate      (monthly)

# ── Volatility settings ───────────────────────────────────────
iv_mode: atm_30d              # 'atm_30d' only (full surface: future)

# ATM IV selection parameters (Polygon options snapshot)
iv_atm_tolerance_pct: 0.02    # ± 2% of spot price = "at the money"
iv_expiry_days_min: 25        # shortest expiry considered (days)
iv_expiry_days_max: 35        # longest expiry considered (days)

# Realized / Historical Volatility rolling windows (trading days)
hv_windows:
  - 21
  - 30
  - 60

# ── Logging ───────────────────────────────────────────────────
logging:
  log_dir: logs
  retention_days: 30          # daily log files kept for this many days

# ── Fetch behavior ────────────────────────────────────────────
fetch:
  polygon_max_retries: 3      # retry attempts on Polygon failure
  polygon_backoff_base: 2     # seconds (exponential: base^attempt)
  fred_sleep_seconds: 0.5     # polite delay between FRED series calls
  default_history_days: 365   # how far back to fetch on first run
